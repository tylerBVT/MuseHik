<nav class="tiles" aria-label="Library">
  <button type="button" class="tile" (click)="nav.go({ page: 'tracks' })">
    <span class="icon">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z" fill="currentColor" />
      </svg>
    </span>
    <span class="name">All tracks</span>
    <span class="hint">{{ library.tracks().length }} {{ hasServer ? 'songs' : 'on this phone' }}</span>
  </button>

  <!-- Laptop-only tiles: the phone has no downloader and no instrumental separator. -->
  @if (hasServer) {
    <button type="button" class="tile" (click)="nav.go({ page: 'download' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z" fill="currentColor" />
        </svg>
      </span>
      <span class="name">Download new tracks</span>
    </button>

    <button type="button" class="tile" (click)="nav.go({ page: 'download-cloud' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.65 4.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96zM16 14h-3v3h-2v-3H8v-2h3V9h2v3h3z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">Download to cloud</span>
      @if (cloudOff()) {
        <span class="hint">Offline</span>
      }
    </button>

    @if (app.aiAllowed()) {
      <button type="button" class="tile" (click)="nav.go({ page: 'separate' })">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
            <path
              d="M7 18h2V6H7zm4 4h2V2h-2zm-8-8h2v-4H3zm12 4h2V6h-2zm4-8v4h2v-4z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="name">Instrumental separator</span>
      </button>
    }

  }

    <button type="button" class="tile" (click)="nav.go({ page: 'create' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M14 10H3v2h11zm0-4H3v2h11zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2zM3 16h7v-2H3z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">Create playlist</span>
    </button>

    <button type="button" class="tile" (click)="nav.go({ page: 'cloud-upload' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.65 4.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96zM14 13v4h-4v-4H7l5-5 5 5z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">Cloud upload</span>
      @if (cloudOff()) {
        <span class="hint">Offline</span>
      }
    </button>

    <button type="button" class="tile" (click)="nav.go({ page: 'cloud' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.65 4.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96zM10 17V10l5 3.5z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">Cloud</span>
      <span class="hint">{{ cloudOff() ? 'Offline' : 'Listen online' }}</span>
    </button>

    <button type="button" class="tile" (click)="nav.go({ page: 'cloud-save' })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.65 4.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96zM17 13l-5 5-5-5h3V9h4v4z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">Download from cloud</span>
      @if (cloudOff()) {
        <span class="hint">Offline</span>
      }
    </button>

  @for (playlist of playlists(); track playlist.id) {
    <button type="button" class="tile" (click)="nav.go({ page: 'playlist', id: playlist.id })">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path
            d="M15 6H3v2h12zm0 4H3v2h12zM3 16h8v-2H3zM17 6v8.18a3 3 0 1 0 2 2.82V8h3V6z"
            fill="currentColor"
          />
        </svg>
      </span>
      <span class="name">{{ playlist.name }}</span>
      <span class="hint">
        {{ playlist.count }} {{ playlist.count === 1 ? 'song' : 'songs' }}
        @if (sharing(playlist); as label) {
          · <span class="shared">{{ label }}</span>
        }
      </span>
    </button>
  }
</nav>
