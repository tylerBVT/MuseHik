# Builds the Windows installer and publishes it as a GitHub Release when a version tag (v1.2.3) is pushed.
# Installed apps find it there and update themselves (desktop/updates.mjs). Start it with: cd desktop && npm run release
# Each command runs through .github/run-and-report.sh: on failure its last lines are posted as an error annotation.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag matches desktop/package.json
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but desktop/package.json says $version"; exit 1
          fi

      # Backend tests run on the author's laptop before the tag is pushed (desktop/scripts/release.mjs): some need
      # its Python venv and ffmpeg, which this machine does not have.

      - name: Build the app
        working-directory: frontend
        run: |
          bash ../.github/run-and-report.sh "npm ci (frontend)" npm ci --no-audit --no-fund
          bash ../.github/run-and-report.sh "Build the app" npx ng build

      - name: Desktop tests
        working-directory: desktop
        run: |
          bash ../.github/run-and-report.sh "npm ci (desktop)" npm ci --no-audit --no-fund
          bash ../.github/run-and-report.sh "Desktop tests" npm test

      - name: Gather Node, Python, backend and app
        working-directory: desktop
        run: bash ../.github/run-and-report.sh "Gather (stage.mjs)" node scripts/stage.mjs

      # Created first: electron-builder's parallel uploads otherwise each create one, and the tag gets two releases.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "MuseHik $GITHUB_REF_NAME" \
            --notes "Download **MuseHik-Setup-${GITHUB_REF_NAME#v}.exe** below and double-click it. Already installed? MuseHik updates itself."

      - name: Build and publish the installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ../.github/run-and-report.sh "electron-builder" npx electron-builder --win --publish always
