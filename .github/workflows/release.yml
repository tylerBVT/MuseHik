# Builds the Windows installer and publishes it as a GitHub Release when a version tag (v1.2.3) is pushed.
# Installed apps find it there and update themselves (desktop/updates.mjs). Start it with: cd desktop && npm run release
# Each command runs through .github/run-and-report.sh: on failure its last lines are posted as an error annotation.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag matches desktop/package.json
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but desktop/package.json says $version"; exit 1
          fi

      # Backend tests run on the author's laptop before the tag is pushed (desktop/scripts/release.mjs): some need
      # its Python venv and ffmpeg, which this machine does not have.

      - name: Build the app
        working-directory: frontend
        run: |
          bash ../.github/run-and-report.sh "npm ci (frontend)" npm ci --no-audit --no-fund
          bash ../.github/run-and-report.sh "Build the app" npx ng build

      - name: Desktop tests
        working-directory: desktop
        run: |
          bash ../.github/run-and-report.sh "npm ci (desktop)" npm ci --no-audit --no-fund
          bash ../.github/run-and-report.sh "Desktop tests" npm test

      - name: Gather Node, Python, backend and app
        working-directory: desktop
        run: bash ../.github/run-and-report.sh "Gather (stage.mjs)" node scripts/stage.mjs

      - name: Build the installer
        working-directory: desktop
        run: bash ../.github/run-and-report.sh "electron-builder" npx electron-builder --win --publish never

      # The built app's backend must start with its own Node and Python before anything is published.
      - name: Smoke test the built app
        working-directory: desktop
        run: bash ../.github/run-and-report.sh "Smoke test" node scripts/smoke.mjs dist/win-unpacked/resources

      # One release, created with all its files at once (electron-builder's own parallel uploads made two per tag).
      - name: Publish the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash ../.github/run-and-report.sh "Publish" gh release create "$GITHUB_REF_NAME" \
            --title "MuseHik $GITHUB_REF_NAME" \
            --notes "Download **MuseHik-Setup-$version.exe** below and double-click it. Already installed? MuseHik updates itself." \
            "dist/MuseHik-Setup-$version.exe" "dist/MuseHik-Setup-$version.exe.blockmap" dist/latest.yml
